name: Build Registry

# 触发条件：
#   - pull_request —— 校验新增/修改的扩展元数据（严格模式，不写文件）
#   - push 到 main —— 重新构建注册表，验证元数据改动后能成功构建
#
# 行为：读取 extensions/*.json 元数据，从各扩展仓库的 GitHub Release 拉取
#       扩展包 zip 并计算 SHA-256，生成 extensions.json。
#       extensions.json 的定期刷新与自动提交由 update.yml 负责。

on:
  pull_request:
    paths:
      - 'extensions/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  push:
    branches: [main]
    paths:
      - 'extensions/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Validate metadata (PR)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_registry.py --validate

      - name: Build registry (push)
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_registry.py

      - name: Show registry diff (push)
        if: github.event_name == 'push'
        run: git diff -- extensions.json || true